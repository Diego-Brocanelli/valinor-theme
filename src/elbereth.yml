$schema: vscode://schemas/color-theme
name: Valinor Elbereth
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.elbereth
type: light
semanticHighlighting: true
colors:
  editorWidget.background: '#e6e9ef'
  # === Editor (área principal de código) ===
  panel.background: '#e6e9ef'          # navbar terminal
  titleBar.activeBackground: '#e6e9ef' # background do navbar principal
  editor.background: '#eff1f5'
  editor.foreground: '#4c4f69'
  editorCursor.foreground: '#dc8a78'
  editor.lineHighlightBackground: '#e6e9ef'
  editor.selectionBackground: '#acb0be'
  editor.selectionHighlightBackground: '#acb0be88'
  editor.wordHighlightBackground: '#acb0be66'
  editorWhitespace.foreground: '#acb0be'
  editorIndentGuide.background1: '#acb0be'
  editorRuler.foreground: '#acb0be'
  editorLineNumber.foreground: '#acb0be'
  editorLineNumber.activeForeground: '#4c4f69'

  # === Sidebar (explorer, arquivos, etc) ===
  sideBar.background: '#e6e9ef'
  sideBar.foreground: '#4c4f69'
  sideBarTitle.foreground: '#1e66f5'
  sideBarSectionHeader.background: '#e6e9ef'
  sideBarSectionHeader.foreground: '#1e66f5'

  # === Status bar (rodapé) ===
  statusBar.background: '#ccd0da'
  statusBar.foreground: '#4c4f69'

  # === Activity bar (barra lateral de ícones) ===
  activityBar.background: '#e6e9ef'
  activityBar.foreground: '#4c4f69'
  activityBarBadge.background: '#1e66f5'
  activityBarBadge.foreground: '#eff1f5'

  # === Terminal integrado ===
  terminal.background: '#eff1f5'
  terminal.foreground: '#4c4f69'
  terminalCursor.foreground: '#dc8a78'

  # === Botões e links ===
  button.background: '#1e66f5'
  button.foreground: '#eff1f5'
  editorLink.activeForeground: '#1e66f5'

  # === Listas (Ctrl+P, Explorer, Quick Pick) ===
  list.activeSelectionBackground: '#1e66f5'      # fundo da linha selecionada (explorer em foco)
  list.activeSelectionForeground: '#fff' # texto da linha selecionada (explorer em foco)
  list.inactiveSelectionBackground: '#1e66f5'     # fundo da linha selecionada (explorer sem foco)
  list.inactiveSelectionForeground: '#fff' # texto da linha selecionada (explorer sem foco)

  list.hoverBackground: '#6296ff' #acb0be
  list.focusHighlightForeground: '#FFFFFF' # altera a cor do texto na linha ativa
  list.highlightForeground: '#1e66f5' # altera a cor do texto nos itens não ativos

  # === Abas (tabs de arquivos) ===
  tab.activeBackground: '#eff1f5'
  tab.activeForeground: '#4c4f69'
  tab.inactiveBackground: '#e6e9ef'
  tab.inactiveForeground: '#4c4f69'

  # === Quick Input (Ctrl+P / Command Palette) ===
  quickInput.background: '#e6e9ef'
  quickInput.foreground: '#4c4f69'
  quickInputList.focusBackground: '#1e66f5'
  quickInputList.focusForeground: '#eff1f5'

  # === Grupos dentro do Quick Pick ===
  pickerGroup.foreground: '#1e66f5'
  pickerGroup.border: '#acb0be'
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#8c8fa1'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#8839ef'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#04a5e5'
- scope:
  - variable
  settings:
    foreground: '#4c4f69'
- scope:
  - variable.language
  settings:
    foreground: '#fe640b'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#40a02b'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#fe640b'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#1e66f5'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#df8e1d'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#df8e1d'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#d20f39'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#179299'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#04a5e5'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#1e66f5'
    fontStyle: bold
