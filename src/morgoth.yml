$schema: vscode://schemas/color-theme
name: Valinor Morgoth
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.morgoth
type: dark
semanticHighlighting: true
# colorSideBar: "#080808"
# colorBackground: "#0a0a0a"
# colorTheme: "#a0a0a0"
# colorContrast "#a0a0a052"
colors:
  # GENERAL
  focusBorder: "#a0a0a052" # Cor da borda de foco em elementos interativos
  progressBar.background: "#a0a0a052" # Cor de fundo da barra de progresso
  selection.background: "#a0a0a052" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#080808' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#fff' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#0a0a0a" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#fff' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#080808" # Fundo da sidebar
  sideBar.foreground: '#c5c9c5' # Texto padrão da sidebar
  sideBarTitle.foreground: '#a0a0a0' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#a0a0a0' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#a0a0a052" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#a0a0a052' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#a0a0a052' # Fundo ao passar o mouse
  list.focusBackground: "#a0a0a052" # Fundo quando focado via teclado
  list.highlightForeground: "#a0a0a0" # Destaque de match (busca)
  list.focusHighlightForeground: '#0a0a0a' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#080808" # Fundo da status bar
  statusBar.foreground: '#fff' # Texto da status bar
  statusBar.noFolderBack: "#a0a0a052" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#a0a0a0" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#080808" # Fundo da barra de título ativa
  menu.background: "#080808" # Fundo dos menus dropdown
  menu.selectionBackground: "#a0a0a052" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#a0a0a0" # Fundo de botões
  button.foreground: '#0a0a0a' # Texto de botões
  button.hoverBackground: "#a0a0a052" # Fundo ao passar o mouse no botão
  textLink.foreground: "#a0a0a0" # Cor de links clicáveis
  editorLink.activeForeground: '#a0a0a0' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#0a0a0a' # Fundo de campos de input
  inputOption.activeBackground: "#a0a0a0" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#0a0a0a" # Texto de opções selecionadas
  quickInput.background: '#080808' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#e0def4' # Texto da palette
  quickInputList.focusBackground: '#a0a0a0' # Fundo do item focado na palette
  quickInputList.focusForeground: '#0a0a0a' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#080808' # Fundo do painel inferior (terminal, output)
  badge.background: "#a0a0a0" # Fundo de badges
  badge.foreground: '#0a0a0a' # Texto de badges

  # TERMINAL
  terminal.background: '#0a0a0a' # Fundo do terminal
  terminal.foreground: '#e0def4' # Texto do terminal
  terminalCursor.foreground: '#e0def4' # Cor do cursor do terminal
  terminal.Cursor.background: "#a0a0a0" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#080808" # Fundo da área de tabs
  tab.activeBackground: "#0a0a0a" # Fundo da tab ativa
  tab.activeForeground: '#e0def4' # Texto da tab ativa
  tab.inactiveBackground: '#080808' # Fundo da tab inativa
  tab.inactiveForeground: '#e0def4' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#0a0a0a" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#080808' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#0a0a0a' # Borda de widgets/modais
  pickerGroup.foreground: "#a0a0a0" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#080808" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#0a0a0a" # Fundo das notificações

  # EDITOR
  editor.background: "#0a0a0a" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#080808' # Linha atual destacada
  editor.selectionBackground: '#a0a0a052' # Fundo da seleção
  editor.selectionHighlightBackground: '#a0a0a052' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#505050'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#8888aa'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#7070a0'
- scope:
  - variable
  settings:
    foreground: '#c8c8c8'
- scope:
  - variable.language
  settings:
    foreground: '#aaaacc'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#7a9a7a'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#9a8a6a'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#7a7aaa'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#7a9090'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#7a9090'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#8a6a6a'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#6a9a8a'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#7a9090'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#7a7aaa'
    fontStyle: bold
