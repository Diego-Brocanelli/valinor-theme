$schema: vscode://schemas/color-theme
name: Valinor Smaug
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.smaug
type: dark
semanticHighlighting: true
colors:
  panel.background: '#221414'   # navbar terminal
  titleBar.activeBackground: '#221414' # background do navbar principal
  editorGroupHeader.tabsBackground: '#221414' # altera o background da barra de tabs
  quickInput.background: '#221414' # Cor de fundo do campo de input da modal de pesquisa
  quickInput.foreground: "#CCCCCC" # Cor do texto dentro do input
  widget.border: '#2c1a1a' # altera a borda da modal de pesquisa
  input.background: '#2c1a1a' # cor de fundo do input text
  editorWidget.background: '#221414' # Fundo principal da janela de pesquisa (Ctrl + F)
  list.inactiveSelectionBackground: '#2c1a1a' # Fundo do item selecionado quando a lista não está em foco

  editor.background: '#2c1a1a'
  editor.foreground: '#e8d8c8'
  editorCursor.foreground: '#e8b090'
  editor.lineHighlightBackground: '#381f1f'
  editor.selectionBackground: '#4a2828'
  editor.selectionHighlightBackground: '#4a282888'
  editor.wordHighlightBackground: '#4a282866'
  editorWhitespace.foreground: '#4a2828'
  editorIndentGuide.background1: '#4a2828'
  editorRuler.foreground: '#4a2828'
  editorLineNumber.foreground: '#4a2828'
  editorLineNumber.activeForeground: '#e8d8c8'
  sideBar.background: '#221414'
  sideBar.foreground: '#e8d8c8'
  sideBarTitle.foreground: '#e8785a'
  sideBarSectionHeader.background: '#381f1f'
  sideBarSectionHeader.foreground: '#e8785a'
  statusBar.background: '#381f1f'
  statusBar.foreground: '#e8d8c8'
  activityBar.background: '#221414'
  activityBar.foreground: '#e8d8c8'
  activityBarBadge.background: '#e8785a'
  activityBarBadge.foreground: '#2c1a1a'
  terminal.background: '#2c1a1a'
  terminal.foreground: '#e8d8c8'
  terminalCursor.foreground: '#e8b090'
  button.background: '#e8785a'
  button.foreground: '#2c1a1a'
  editorLink.activeForeground: '#e8785a'
  list.activeSelectionBackground: '#e8785a'
  list.activeSelectionForeground: '#2c1a1a'
  list.hoverBackground: '#4a2828'
  list.focusHighlightForeground: '#2c1a1a'
  list.highlightForeground: '#bc6149'
  tab.border: "#2c1a1a" # Borda que separa as tabs entre si (linhas verticais entre abas)
  tab.activeBorder: "#2c1a1a" # Borda inferior da aba ativa (a mais usada para destacar a aba atual)
  tab.activeBorderTop: "#2c1a1a" # Borda superior da aba ativa (útil em alguns temas ou layouts)
  tab.unfocusedActiveBorder: "#2c1a1a" # Borda inferior da aba ativa quando o grupo de editores não está em foco
  tab.unfocusedActiveBorderTop: "#2c1a1a" # Borda superior da aba ativa quando o grupo não está em foco
  editorGroupHeader.tabsBorder: "#2c1a1a" # Borda da barra de abas completa (abaixo de todas as tabs, quando ativada)
  editorGroup.border: "#2c1a1a" # Borda geral entre grupos de editores (útil quando há múltiplas colunas de editores)
  tab.activeBackground: '#2c1a1a'
  tab.activeForeground: '#e8d8c8'
  tab.inactiveBackground: '#221414'
  tab.inactiveForeground: '#e8d8c8'
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#7a5050'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#fd6883'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#a8a9eb'
- scope:
  - variable
  settings:
    foreground: '#e8d8c8'
- scope:
  - variable.language
  settings:
    foreground: '#f38d70'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#adda78'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#f9cc6c'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#85dacc'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#a8a9eb'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#a8a9eb'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#fd6883'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#85dacc'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#a8a9eb'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#85dacc'
    fontStyle: bold
