# Valinor Shelob — inspirado em Vantablack
# Cores de interface geradas por src/lib/template.js a partir de "palette".
# Use "colors" apenas para sobrescrever uma chave específica.
$schema: vscode://schemas/color-theme
name: Valinor Shelob
type: dark
upstream: Vantablack
author: Diego Brocanelli
palette:
  bg: "#000000"
  bgAlt: "#050505"
  fg: "#b0b0b0"
  accent: "#909090"
  statusBar: muted
  red: "#a07070"
  orange: "#a07858"
  yellow: "#a09060"
  green: "#709070"
  cyan: "#609080"
  blue: "#7080a0"
  magenta: "#8a7a9a"
syntax:
  comment: "#5c5c5c"
  keyword: "#707085"
  storage: "#606075"
  variable: "#b0b0b0"
  this: "#908080"
  string: "#608060"
  number: "#806050"
  function: "#607080"
  type: "#607575"
  tag: "#806060"
  attribute: "#508070"
  heading: "#607080"
