$schema: vscode://schemas/color-theme
name: Valinor Galadriel
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.galadriel_omarchy
type: light
semanticHighlighting: true
colors:
  editor.background: '#ffffff'
  editor.foreground: '#1a1a1a'
  editorCursor.foreground: '#333333'
  editor.lineHighlightBackground: '#f5f5f5'
  editor.selectionBackground: '#d0e8ff'
  editor.selectionHighlightBackground: '#d0e8ff88'
  editor.wordHighlightBackground: '#d0e8ff66'
  editorWhitespace.foreground: '#cccccc'
  editorIndentGuide.background1: '#d0e8ff'
  editorRuler.foreground: '#d0e8ff'
  editorLineNumber.foreground: '#d0e8ff'
  editorLineNumber.activeForeground: '#1a1a1a'
  sideBar.background: '#f0f0f0'
  sideBar.foreground: '#333333'
  sideBarTitle.foreground: '#4a8fd8'
  sideBarSectionHeader.background: '#f5f5f5'
  sideBarSectionHeader.foreground: '#4a8fd8'
  statusBar.background: '#e0e0e0'
  statusBar.foreground: '#333333'
  activityBar.background: '#f0f0f0'
  activityBar.foreground: '#1a1a1a'
  activityBarBadge.background: '#4a8fd8'
  activityBarBadge.foreground: '#ffffff'
  terminal.background: '#ffffff'
  terminal.foreground: '#1a1a1a'
  terminalCursor.foreground: '#333333'
  button.background: '#4a8fd8'
  button.foreground: '#ffffff'
  editorLink.activeForeground: '#4a8fd8'
  list.activeSelectionBackground: '#4a8fd8'
  list.activeSelectionForeground: '#ffffff'
  list.hoverBackground: '#d0e8ff'
  list.focusHighlightForeground: '#ffffff'
  list.highlightForeground: '#ffffff'
  tab.activeBackground: '#ffffff'
  tab.activeForeground: '#1a1a1a'
  tab.inactiveBackground: '#f0f0f0'
  tab.inactiveForeground: '#333333'
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#999999'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#7a3e9d'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#4b83cd'
- scope:
  - variable
  settings:
    foreground: '#1a1a1a'
- scope:
  - variable.language
  settings:
    foreground: '#ab6526'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#448c27'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#ab6526'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#aa3731'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#4b83cd'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#4b83cd'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#4b83cd'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#448c27'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#4b83cd'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#aa3731'
    fontStyle: bold
