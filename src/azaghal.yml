$schema: vscode://schemas/color-theme
name: Valinor Azaghâl
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.azaghal
type: dark
semanticHighlighting: true
# colorSideBar: "#1f2127"
# colorBackground: "#0d1016"
# colorTheme: "#62a0ea"
# colorContrast "#62a0ea52"
colors:
  # GENERAL
  focusBorder: "#62a0ea52" # Cor da borda de foco em elementos interativos
  progressBar.background: "#62a0ea52" # Cor de fundo da barra de progresso
  selection.background: "#62a0ea52" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#1f2127' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#e0def4' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#62a0ea" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#0d1016' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#1f2127" # Fundo da sidebar
  sideBar.foreground: '#c5c9c5' # Texto padrão da sidebar
  sideBarTitle.foreground: '#62a0ea' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#62a0ea' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#62a0ea52" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#62a0ea52' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#62a0ea52' # Fundo ao passar o mouse
  list.focusBackground: "#62a0ea52" # Fundo quando focado via teclado
  list.highlightForeground: "#62a0ea" # Destaque de match (busca)
  list.focusHighlightForeground: '#0d1016' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#62a0ea" # Fundo da status bar
  statusBar.foreground: '#0d1016' # Texto da status bar
  statusBar.noFolderBack: "#62a0ea52" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#62a0ea" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#1f2127" # Fundo da barra de título ativa
  menu.background: "#1f2127" # Fundo dos menus dropdown
  menu.selectionBackground: "#62a0ea52" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#62a0ea" # Fundo de botões
  button.foreground: '#0d1016' # Texto de botões
  button.hoverBackground: "#62a0ea52" # Fundo ao passar o mouse no botão
  textLink.foreground: "#62a0ea" # Cor de links clicáveis
  editorLink.activeForeground: '#62a0ea' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#0d1016' # Fundo de campos de input
  inputOption.activeBackground: "#62a0ea" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#0d1016" # Texto de opções selecionadas
  quickInput.background: '#1f2127' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#e0def4' # Texto da palette
  quickInputList.focusBackground: '#62a0ea' # Fundo do item focado na palette
  quickInputList.focusForeground: '#0d1016' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#1f2127' # Fundo do painel inferior (terminal, output)
  badge.background: "#62a0ea" # Fundo de badges
  badge.foreground: '#0d1016' # Texto de badges

  # TERMINAL
  terminal.background: '#0d1016' # Fundo do terminal
  terminal.foreground: '#e0def4' # Texto do terminal
  terminalCursor.foreground: '#e0def4' # Cor do cursor do terminal
  terminal.Cursor.background: "#62a0ea" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#1f2127" # Fundo da área de tabs
  tab.activeBackground: "#0d1016" # Fundo da tab ativa
  tab.activeForeground: '#e0def4' # Texto da tab ativa
  tab.inactiveBackground: '#1f2127' # Fundo da tab inativa
  tab.inactiveForeground: '#e0def4' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#0d1016" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#1f2127' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#0d1016' # Borda de widgets/modais
  pickerGroup.foreground: "#62a0ea" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#1f2127" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#0d1016" # Fundo das notificações

  # EDITOR
  editor.background: "#0d1016" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#1f2127' # Linha atual destacada
  editor.selectionBackground: '#62a0ea52' # Fundo da seleção
  editor.selectionHighlightBackground: '#62a0ea52' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  settings:
    foreground: '#4C566A'
    fontStyle: italic
- scope:
  - keyword
  settings:
    foreground: '#c09dea'
- scope:
  - variable
  settings:
    foreground: '#C5C8C6'
- scope:
  - string
  settings:
    foreground: '#A3BE8C'
- scope:
  - constant
  settings:
    foreground: '#fefefe'
- scope:
  - storage
  settings:
    foreground: '#c09dea'
- scope:
  - function
  settings:
    foreground: '#B48EAD'
- scope:
  - class
  settings:
    foreground: '#B48EAD'
- scope:
  - type
  settings:
    foreground: '#A3BE8C'
- name: User-defined class names
  scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  - support.type
  - entity.other.attribute-name
  settings:
    foreground: '#89b4fa'
- name: this, super, self, etc.
  scope:
  - keyword.expressions-and-types.swift
  - keyword.other.this
  - variable.language punctuation.definition.variable.php
  - variable.other.readwrite.instance.ruby
  - variable.parameter.function.language.special
  settings:
    foreground: '#86d8e7'
- name: this, super, self, etc italic.
  scope:
  - keyword.expressions-and-types.swift
  - keyword.other.this
  - variable.language
  - variable.language punctuation.definition.variable.php
  - variable.other.readwrite.instance.ruby
  - variable.parameter.function.language.special
  settings:
    fontStyle: italic
- name: Function names
  scope:
  - entity.name.function
  - meta.function-call.object
  - meta.function-call.php
  - meta.function-call.static
  - meta.method-call.java meta.method
  - meta.method.groovy
  - support.function.any-method.lua
  - keyword.operator.function.infix
  settings:
    foreground: '#89b4fa'
- name: Inherited classes
  scope:
  - entity.other.inherited-class
  settings:
    fontStyle: italic
    foreground: '#89b4fa'
- scope: punctuation.definition.variable.php
  settings:
    foreground: '#86d8e7'
    fontStyle: italic
- scope: punctuation.definition.bracket.php, punctuation.definition.parenthesis.php
  settings:
    foreground: '#f4f4f4'
- scope: keyword.control.php
  settings:
    foreground: '#A3BE8C'
    fontStyle: italic
- scope: string.quoted.double.php, string.quoted.single.php
  settings:
    foreground: '#9fd99a'
- scope: constant.numeric.php
  settings:
    foreground: '#C5C8C6'
- scope: variable.language.php
  settings:
    foreground: '#caa5f6'
    fontStyle: italic
- name: Comments
  scope:
  - comment
  - punctuation.definition.comment
  - unused.comment
  - wildcard.comment
  settings:
    foreground: '#74788e'
    fontStyle: italic
- name: Function parameters
  scope:
  - entity.name.variable.parameter
  - meta.at-rule.function variable
  - meta.at-rule.mixin variable
  - meta.function.arguments variable.other.php
  - meta.selectionset.graphql meta.arguments.graphql variable.arguments.graphql
  - variable.parameter
  settings:
    fontStyle: italic
- scope: keyword.control.php
  settings:
    foreground: '#cba6f7'
    fontStyle: italic
- name: HTML tags
  scope:
  - entity.name.tag
  settings:
    foreground: '#FF79C6'
- name: CSS attribute parent selectors ('&')
  scope:
  - entity.other.attribute-name.parent-selector
  settings:
    foreground: '#FF79C6'
- name: HTML/CSS attribute names
  scope:
  - entity.other.attribute-name
  settings:
    foreground: '#7bb256'
    fontStyle: italic
- name: Keywords
  scope:
  - punctuation.definition.keyword
  settings:
    foreground: '#e1cc9e'
    fontStyle: italic
- name: Keyword "new"
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Separators
  scope:
  - constant.other.symbol.hashkey punctuation.definition.constant.ruby
  - entity.other.attribute-name.placeholder punctuation
  - entity.other.attribute-name.pseudo-class punctuation
  - entity.other.attribute-name.pseudo-element punctuation
  - meta.group.double.toml
  - meta.group.toml
  - meta.object-binding-pattern-variable punctuation.destructuring
  - punctuation.colon.graphql
  - punctuation.definition.block.scalar.folded.yaml
  - punctuation.definition.block.scalar.literal.yaml
  - punctuation.definition.block.sequence.item.yaml
  - punctuation.definition.entity.other.inherited-class
  - punctuation.function.swift
  - punctuation.separator.dictionary.key-value
  - punctuation.separator.hash
  - punctuation.separator.inheritance
  - punctuation.separator.key-value
  - punctuation.separator.key-value.mapping.yaml
  - punctuation.separator.namespace
  - punctuation.separator.pointer-access
  - punctuation.separator.slice
  - string.unquoted.heredoc punctuation.definition.string
  - support.other.chomping-indicator.yaml
  - punctuation.separator.annotation
  settings:
    foreground: '#fefefe'
activityBar.background: '#2E353F'
activityBar.foreground: '#C5C8C6'
activityBarBadge.background: '#A3BE8C'
activityBarBadge.foreground: '#FFFFFF'