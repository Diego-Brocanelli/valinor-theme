$schema: vscode://schemas/color-theme
name: Valinor Arwen
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.arwen
type: dark
semanticHighlighting: true
# colorSideBar: "#1f1d2e"
# colorBackground: "#191724"
# colorTheme: "#c4a7e7"
# colorContrast "#c4a7e752"
colors:
  # GENERAL
  focusBorder: "#c4a7e752" # Cor da borda de foco em elementos interativos
  progressBar.background: "#c4a7e752" # Cor de fundo da barra de progresso
  selection.background: "#c4a7e752" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#1f1d2e' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#e0def4' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#c4a7e7" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#191724' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#1f1d2e" # Fundo da sidebar
  sideBar.foreground: '#c5c9c5' # Texto padrão da sidebar
  sideBarTitle.foreground: '#c4a7e7' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#c4a7e7' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#c4a7e752" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#c4a7e752' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#c4a7e752' # Fundo ao passar o mouse
  list.focusBackground: "#c4a7e752" # Fundo quando focado via teclado
  list.highlightForeground: "#c4a7e7" # Destaque de match (busca)
  list.focusHighlightForeground: '#191724' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#c4a7e7" # Fundo da status bar
  statusBar.foreground: '#191724' # Texto da status bar
  statusBar.noFolderBack: "#c4a7e752" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#c4a7e7" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#1f1d2e" # Fundo da barra de título ativa
  menu.background: "#1f1d2e" # Fundo dos menus dropdown
  menu.selectionBackground: "#c4a7e752" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#c4a7e7" # Fundo de botões
  button.foreground: '#191724' # Texto de botões
  button.hoverBackground: "#c4a7e752" # Fundo ao passar o mouse no botão
  textLink.foreground: "#c4a7e7" # Cor de links clicáveis
  editorLink.activeForeground: '#c4a7e7' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#191724' # Fundo de campos de input
  inputOption.activeBackground: "#c4a7e7" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#191724" # Texto de opções selecionadas
  quickInput.background: '#1f1d2e' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#e0def4' # Texto da palette
  quickInputList.focusBackground: '#c4a7e7' # Fundo do item focado na palette
  quickInputList.focusForeground: '#191724' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#1f1d2e' # Fundo do painel inferior (terminal, output)
  badge.background: "#c4a7e7" # Fundo de badges
  badge.foreground: '#191724' # Texto de badges

  # TERMINAL
  terminal.background: '#191724' # Fundo do terminal
  terminal.foreground: '#e0def4' # Texto do terminal
  terminalCursor.foreground: '#e0def4' # Cor do cursor do terminal
  terminal.Cursor.background: "#c4a7e7" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#1f1d2e" # Fundo da área de tabs
  tab.activeBackground: "#191724" # Fundo da tab ativa
  tab.activeForeground: '#e0def4' # Texto da tab ativa
  tab.inactiveBackground: '#1f1d2e' # Fundo da tab inativa
  tab.inactiveForeground: '#e0def4' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#191724" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#1f1d2e' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#191724' # Borda de widgets/modais
  pickerGroup.foreground: "#c4a7e7" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#1f1d2e" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#191724" # Fundo das notificações

  # EDITOR
  editor.background: "#191724" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#1f1d2e' # Linha atual destacada
  editor.selectionBackground: '#c4a7e752' # Fundo da seleção
  editor.selectionHighlightBackground: '#c4a7e752' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual

tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#6e6a86'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#c4a7e7'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#31748f'
- scope:
  - variable
  settings:
    foreground: '#e0def4'
- scope:
  - variable.language
  settings:
    foreground: '#ebbcba'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#9ccfd8'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#f6c177'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#9ccfd8'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#c4a7e7'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#c4a7e7'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#eb6f92'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#31748f'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#31748f'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#9ccfd8'
    fontStyle: bold
