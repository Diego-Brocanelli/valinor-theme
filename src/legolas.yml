$schema: vscode://schemas/color-theme
name: Valinor Legolas
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.legolas
type: dark
semanticHighlighting: true
semanticTokenColors:
  parameter.declaration:
    foreground: '#e0af68'
  parameter:
    foreground: '#d9d4cd'
  property.declaration:
    foreground: '#73daca'
  property.defaultLibrary:
    foreground: '#2ac3de'
  '*.defaultLibrary':
    foreground: '#2ac3de'
  variable.defaultLibrary:
    foreground: '#2ac3de'
  variable.declaration:
    foreground: '#bb9af7'
  variable:
    foreground: '#c0caf5'
# colorSideBar: "#16161e"
# colorBackground: "#1a1b26"
# colorTheme: "#1a1b26"
# colorContrast "#1a1b2652"
colors:
  # GENERAL
  focusBorder: "#1a1b2652" # Cor da borda de foco em elementos interativos
  progressBar.background: "#1a1b2652" # Cor de fundo da barra de progresso
  selection.background: "#1a1b2652" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#16161e' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#fff' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#1a1b26" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#fff' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#16161e" # Fundo da sidebar
  sideBar.foreground: '#c5c9c5' # Texto padrão da sidebar
  sideBarTitle.foreground: '#1a1b26' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#1a1b26' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#1a1b2652" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#1a1b2652' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#1a1b2652' # Fundo ao passar o mouse
  list.focusBackground: "#1a1b2652" # Fundo quando focado via teclado
  list.highlightForeground: "#1a1b26" # Destaque de match (busca)
  list.focusHighlightForeground: '#1a1b26' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#16161e" # Fundo da status bar
  statusBar.foreground: '#fff' # Texto da status bar
  statusBar.noFolderBack: "#1a1b2652" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#1a1b26" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#16161e" # Fundo da barra de título ativa
  menu.background: "#16161e" # Fundo dos menus dropdown
  menu.selectionBackground: "#1a1b2652" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#1a1b26" # Fundo de botões
  button.foreground: '#1a1b26' # Texto de botões
  button.hoverBackground: "#1a1b2652" # Fundo ao passar o mouse no botão
  textLink.foreground: "#1a1b26" # Cor de links clicáveis
  editorLink.activeForeground: '#1a1b26' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#1a1b26' # Fundo de campos de input
  inputOption.activeBackground: "#1a1b26" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#1a1b26" # Texto de opções selecionadas
  quickInput.background: '#16161e' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#e0def4' # Texto da palette
  quickInputList.focusBackground: '#1a1b26' # Fundo do item focado na palette
  quickInputList.focusForeground: '#1a1b26' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#16161e' # Fundo do painel inferior (terminal, output)
  badge.background: "#1a1b26" # Fundo de badges
  badge.foreground: '#fff' # Texto de badges

  # TERMINAL
  terminal.background: '#1a1b26' # Fundo do terminal
  terminal.foreground: '#e0def4' # Texto do terminal
  terminalCursor.foreground: '#e0def4' # Cor do cursor do terminal
  terminal.Cursor.background: "#1a1b26" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#16161e" # Fundo da área de tabs
  tab.activeBackground: "#1a1b26" # Fundo da tab ativa
  tab.activeForeground: '#e0def4' # Texto da tab ativa
  tab.inactiveBackground: '#16161e' # Fundo da tab inativa
  tab.inactiveForeground: '#e0def4' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#1a1b26" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#16161e' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#1a1b26' # Borda de widgets/modais
  pickerGroup.foreground: "#1a1b26" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#16161e" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#1a1b26" # Fundo das notificações

  # EDITOR
  editor.background: "#1a1b26" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#16161e' # Linha atual destacada
  editor.selectionBackground: '#1a1b2652' # Fundo da seleção
  editor.selectionHighlightBackground: '#1a1b2652' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual
