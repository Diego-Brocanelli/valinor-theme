$schema: vscode://schemas/color-theme
name: Valinor Galadriel
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.galadriel
type: light
semanticHighlighting: true
# colorSideBar: "#EEE8D5"
# colorBackground: "#FEF3DA"
# colorTheme: "#e8dcb6"
# colorContrast "#e8dcb652"
colors:
  # GENERAL
  focusBorder: "#e8dcb652" # Cor da borda de foco em elementos interativos
  progressBar.background: "#e8dcb652" # Cor de fundo da barra de progresso
  selection.background: "#e8dcb652" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#EEE8D5' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#e0def4' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#e8dcb6" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#000' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#EEE8D5" # Fundo da sidebar
  sideBar.foreground: '#000' # Texto padrão da sidebar
  sideBarTitle.foreground: '#000' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#000' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#e8dcb652" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#e8dcb652' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#e8dcb652' # Fundo ao passar o mouse
  list.focusBackground: "#e8dcb652" # Fundo quando focado via teclado
  list.highlightForeground: "#000" # Destaque de match (busca)
  list.focusHighlightForeground: '#000' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#e8dcb6" # Fundo da status bar
  statusBar.foreground: '#000' # Texto da status bar
  statusBar.noFolderBack: "#e8dcb652" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#e8dcb6" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#EEE8D5" # Fundo da barra de título ativa
  menu.background: "#EEE8D5" # Fundo dos menus dropdown
  menu.selectionBackground: "#e8dcb652" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#e8dcb6" # Fundo de botões
  button.foreground: '#000' # Texto de botões
  button.hoverBackground: "#e8dcb652" # Fundo ao passar o mouse no botão
  textLink.foreground: "#000" # Cor de links clicáveis
  editorLink.activeForeground: '#000' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#FEF3DA' # Fundo de campos de input
  inputOption.activeBackground: "#e8dcb6" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#000" # Texto de opções selecionadas
  quickInput.background: '#EEE8D5' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#000' # Texto da palette
  quickInputList.focusBackground: '#e8dcb6' # Fundo do item focado na palette
  quickInputList.focusForeground: '#000' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#EEE8D5' # Fundo do painel inferior (terminal, output)
  badge.background: "#e8dcb6" # Fundo de badges
  badge.foreground: '#000' # Texto de badges

  # TERMINAL
  terminal.background: '#FEF3DA' # Fundo do terminal
  terminal.foreground: '#000' # Texto do terminal
  terminalCursor.foreground: '#000' # Cor do cursor do terminal
  terminal.Cursor.background: "#e8dcb6" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#EEE8D5" # Fundo da área de tabs
  tab.activeBackground: "#FEF3DA" # Fundo da tab ativa
  tab.activeForeground: '#000' # Texto da tab ativa
  tab.inactiveBackground: '#EEE8D5' # Fundo da tab inativa
  tab.inactiveForeground: '#000' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#FEF3DA" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#EEE8D5' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#FEF3DA' # Borda de widgets/modais
  pickerGroup.foreground: "#000" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#EEE8D5" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#FEF3DA" # Fundo das notificações

  # EDITOR
  editor.background: "#FEF3DA" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#EEE8D5' # Linha atual destacada
  editor.selectionBackground: '#e8dcb652' # Fundo da seleção
  editor.selectionHighlightBackground: '#e8dcb652' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual
  editor.findMatchHighlightBackground: "#EEE8D5"
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#928374'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#fb4934'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#d3869b'
- scope:
  - variable
  settings:
    foreground: '#ebdbb2'
- scope:
  - variable.language
  settings:
    foreground: '#fe8019'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#b8bb26'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#d79921'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#e8dcb6'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#8ec07c'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#8ec07c'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#fb4934'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#83a598'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#8ec07c'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#e8dcb6'
    fontStyle: bold
