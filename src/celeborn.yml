$schema: vscode://schemas/color-theme
name: Valinor Celeborn
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.celeborn
type: dark
semanticHighlighting: true
# colorSideBar: "#181825"
# colorBackground: "#1e1e2e"
# colorTheme: "#89b4fa"
# colorContrast "#89b4fa52"
colors:
  # GENERAL
  focusBorder: "#89b4fa52" # Cor da borda de foco em elementos interativos
  progressBar.background: "#89b4fa52" # Cor de fundo da barra de progresso
  selection.background: "#89b4fa52" # Cor de seleção global (listas, inputs, etc)

  # ACTIVITY BAR (barra lateral de ícones)
  activityBar.background: '#181825' # Fundo da barra de atividades (ícones laterais)
  activityBar.foreground: '#e0def4' # Cor dos ícones na barra de atividades
  activityBarBadge.background: "#89b4fa" # Fundo do badge (notificações)
  activityBarBadge.foreground: '#1e1e2e' # Cor do texto do badge

  # SIDE BAR (explorer, search, etc)
  sideBar.background: "#181825" # Fundo da sidebar
  sideBar.foreground: '#c5c9c5' # Texto padrão da sidebar
  sideBarTitle.foreground: '#89b4fa' # Título da sidebar
  sideBarSectionHeader.background: '#1f1f28' # Fundo dos headers de seção
  sideBarSectionHeader.foreground: '#89b4fa' # Texto dos headers de seção
  list.inactiveSelectionBackground: "#89b4fa52" # Fundo de item selecionado sem foco
  list.inactiveSelectionForeground: '#000' # Texto de item selecionado sem foco
  list.activeSelectionBackground: '#89b4fa52' # Fundo de item selecionado com foco
  list.activeSelectionForeground: '#000' # Texto de item selecionado com foco
  list.hoverBackground: '#89b4fa52' # Fundo ao passar o mouse
  list.focusBackground: "#89b4fa52" # Fundo quando focado via teclado
  list.highlightForeground: "#89b4fa" # Destaque de match (busca)
  list.focusHighlightForeground: '#1e1e2e' # Cor do highlight quando focado

  # STATUS BAR
  statusBar.background: "#89b4fa" # Fundo da status bar
  statusBar.foreground: '#1e1e2e' # Texto da status bar
  statusBar.noFolderBack: "#89b4fa52" # Fundo quando nenhum projeto está aberto
  statusBar.remoteBackground: "#89b4fa" # Fundo quando conectado remotamente

  # TITLE BAR / MENUS
  titleBar.activeBackground: "#181825" # Fundo da barra de título ativa
  menu.background: "#181825" # Fundo dos menus dropdown
  menu.selectionBackground: "#89b4fa52" # Fundo de item selecionado no menu

  # BUTTONS / LINKS
  button.background: "#89b4fa" # Fundo de botões
  button.foreground: '#1e1e2e' # Texto de botões
  button.hoverBackground: "#89b4fa52" # Fundo ao passar o mouse no botão
  textLink.foreground: "#89b4fa" # Cor de links clicáveis
  editorLink.activeForeground: '#89b4fa' # Cor de links ativos dentro do editor

  # INPUTS / FORMS
  input.background: '#1e1e2e' # Fundo de campos de input
  inputOption.activeBackground: "#89b4fa" # Fundo de opções selecionadas (checkbox/radio)
  inputOption.activeForeground: "#1e1e2e" # Texto de opções selecionadas
  quickInput.background: '#181825' # Fundo da palette (Ctrl+P, Ctrl+Shift+P)
  quickInput.foreground: '#e0def4' # Texto da palette
  quickInputList.focusBackground: '#89b4fa' # Fundo do item focado na palette
  quickInputList.focusForeground: '#1e1e2e' # Texto do item focado na palette

  # PANEL (terminal, output, problems)
  panel.background: '#181825' # Fundo do painel inferior (terminal, output)
  badge.background: "#89b4fa" # Fundo de badges
  badge.foreground: '#1e1e2e' # Texto de badges

  # TERMINAL
  terminal.background: '#1e1e2e' # Fundo do terminal
  terminal.foreground: '#e0def4' # Texto do terminal
  terminalCursor.foreground: '#e0def4' # Cor do cursor do terminal
  terminal.Cursor.background: "#89b4fa" # Cor de fundo do cursor (bloco)

  # TABS
  editorGroupHeader.tabsBackground: "#181825" # Fundo da área de tabs
  tab.activeBackground: "#1e1e2e" # Fundo da tab ativa
  tab.activeForeground: '#e0def4' # Texto da tab ativa
  tab.inactiveBackground: '#181825' # Fundo da tab inativa
  tab.inactiveForeground: '#e0def4' # Texto da tab inativa

  # BREADCRUMBS
  breadcrumb.background: "#1e1e2e" # Fundo do breadcrumb (caminho do arquivo)

  # WIDGETS (modais, popups, find)
  editorWidget.background: '#181825' # Fundo de widgets (ex: Ctrl+F)
  widget.border: '#1e1e2e' # Borda de widgets/modais
  pickerGroup.foreground: "#89b4fa" # Título de grupos na palette
  pickerGroup.border: '#403d52' # Borda separadora de grupos
  debugToolBar.background: "#181825" # Fundo da toolbar de debug

  # NOTIFICATIONS
  notification.background: "#1e1e2e" # Fundo das notificações

  # EDITOR
  editor.background: "#1e1e2e" # Fundo do editor
  editor.foreground: '#c5c9c5' # Texto padrão do editor
  editorCursor.foreground: '#c8c093' # Cor do cursor
  editor.lineHighlightBackground: '#181825' # Linha atual destacada
  editor.selectionBackground: '#89b4fa52' # Fundo da seleção
  editor.selectionHighlightBackground: '#89b4fa52' # Fundo de seleção secundária
  editor.wordHighlightBackground: '#2d4f6766' # Destaque de palavras iguais
  editorWhitespace.foreground: '#363646' # Caracteres invisíveis
  editorIndentGuide.background1: '#2d4f67' # Guias de indentação
  editorRuler.foreground: '#2d4f67' # Régua vertical
  editorLineNumber.foreground: '#2d4f67' # Números de linha
  editorLineNumber.activeForeground: '#c5c9c5' # Número da linha atual
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#6c7086'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#cba6f7'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#89dceb'
- scope:
  - variable
  settings:
    foreground: '#cdd6f4'
- scope:
  - variable.language
  settings:
    foreground: '#f38ba8'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#a6e3a1'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#fab387'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#89b4fa'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#f9e2af'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#f9e2af'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#f38ba8'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#74c7ec'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#89dceb'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#89b4fa'
    fontStyle: bold
