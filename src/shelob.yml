$schema: vscode://schemas/color-theme
name: Valinor Shelob
author: Diego Brocanelli
maintainers:
- Diego Brocanelli <diegod2@msn.com>
semanticClass: theme.valinor.shelob
type: dark
semanticHighlighting: true
colors:
  panel.background: '#050505'   # navbar terminal
  titleBar.activeBackground: '#050505' # background do navbar principal
  editorGroupHeader.tabsBackground: '#050505' # altera o background da barra de tabs
  quickInput.background: '#050505' # Cor de fundo do campo de input da modal de pesquisa
  input.background: '#050505' # cor de fundo do input text
  quickInputList.focusBackground: '#2c1a1a'
  quickInputList.focusForeground: '#ccc'
  pickerGroup.foreground: '#fff'
  pickerGroup.border: '#1a1a1a'
  inputValidation.infoBorder: '#1a1a1a'
  widget.border: '#1a1a1a' # altera a borda da modal de pesquisa
  editorWidget.background: '#050505' # Fundo principal da janela de pesquisa (Ctrl + F)
  quickInput.foreground: "#fff" # Cor do texto dentro do input

  editor.background: '#000000'
  editor.foreground: '#b0b0b0'
  editorCursor.foreground: '#b0b0b0'
  editor.lineHighlightBackground: '#0d0d0d'
  editor.selectionBackground: '#1a1a1a'
  editor.selectionHighlightBackground: '#1a1a1a88'
  editor.wordHighlightBackground: '#1a1a1a66'
  editorWhitespace.foreground: '#1a1a1a'
  editorIndentGuide.background1: '#1a1a1a'
  editorRuler.foreground: '#1a1a1a'
  editorLineNumber.foreground: '#1a1a1a'
  editorLineNumber.activeForeground: '#b0b0b0'
  sideBar.background: '#050505'
  sideBar.foreground: '#909090'
  sideBarTitle.foreground: '#505060'
  sideBarSectionHeader.background: '#0d0d0d'
  sideBarSectionHeader.foreground: '#505060'
  statusBar.background: '#111111'
  statusBar.foreground: '#909090'
  activityBar.background: '#050505'
  activityBar.foreground: '#b0b0b0'
  activityBarBadge.background: '#505060'
  activityBarBadge.foreground: '#000000'
  terminal.background: '#000000'
  terminal.foreground: '#b0b0b0'
  terminalCursor.foreground: '#b0b0b0'
  button.background: '#505060'
  button.foreground: '#000000'
  editorLink.activeForeground: '#505060'
  list.activeSelectionBackground: '#505060'
  list.activeSelectionForeground: '#000000'
  list.hoverBackground: '#1a1a1a'
  list.focusHighlightForeground: '#e0e0e0'
  list.highlightForeground: '#e0e0e0'
  tab.border: "#1a1a1a" # Borda que separa as tabs entre si (linhas verticais entre abas)
  tab.activeBorder: "#1a1a1a" # Borda inferior da aba ativa (a mais usada para destacar a aba atual)
  tab.activeBorderTop: "#1a1a1a" # Borda superior da aba ativa (útil em alguns temas ou layouts)
  tab.unfocusedActiveBorder: "#1a1a1a" # Borda inferior da aba ativa quando o grupo de editores não está em foco
  tab.unfocusedActiveBorderTop: "#1a1a1a" # Borda superior da aba ativa quando o grupo não está em foco
  editorGroupHeader.tabsBorder: "#1a1a1a" # Borda da barra de abas completa (abaixo de todas as tabs, quando ativada)
  editorGroup.border: "#1a1a1a" # Borda geral entre grupos de editores (útil quando há múltiplas colunas de editores)
  tab.activeBackground: '#000000'
  tab.activeForeground: '#b0b0b0'
  tab.inactiveBackground: '#050505'
  tab.inactiveForeground: '#909090'
tokenColors:
- name: Keywords & Storage – italic (valinor-patch)
  scope:
  - keyword.control
  - keyword.operator.expression
  - keyword.operator.new
  - keyword.control.new
  - storage.type
  - storage.modifier
  - keyword.other.use
  - keyword.other.namespace
  - storage.modifier.extends
  - entity.other.inherited-class
  - variable.language
  - variable.language.this
  - variable.language.self
  - variable.language.super
  - variable.language.parent
  - variable.language punctuation.definition.variable.php
  - punctuation.definition.variable.php
  - keyword.control.php
  - keyword.control.flow
  - keyword.control.async-modifier
  - keyword.control.import
  - keyword.control.export
  - keyword.control.from
  - keyword.control.return
  settings:
    fontStyle: italic
- scope:
  - comment
  - punctuation.definition.comment
  settings:
    foreground: '#404040'
    fontStyle: italic
- scope:
  - keyword
  - keyword.control
  - keyword.operator.expression
  settings:
    foreground: '#707085'
- scope:
  - storage
  - storage.type
  - storage.modifier
  settings:
    foreground: '#606075'
- scope:
  - variable
  settings:
    foreground: '#b0b0b0'
- scope:
  - variable.language
  settings:
    foreground: '#908080'
    fontStyle: italic
- scope:
  - string
  - string.quoted
  - punctuation.definition.string
  settings:
    foreground: '#608060'
- scope:
  - constant
  - constant.numeric
  - constant.language
  settings:
    foreground: '#806050'
- scope:
  - entity.name.function
  - support.function
  settings:
    foreground: '#607080'
- scope:
  - entity.name.type.class
  - entity.name.class
  - support.class
  settings:
    foreground: '#607575'
- scope:
  - entity.other.inherited-class
  settings:
    foreground: '#607575'
    fontStyle: italic
- scope:
  - entity.name.tag
  settings:
    foreground: '#806060'
- scope:
  - entity.other.attribute-name
  settings:
    foreground: '#508070'
    fontStyle: italic
- scope:
  - support.type
  - support.class
  settings:
    foreground: '#607575'
- name: Function parameters
  scope:
  - variable.parameter
  - entity.name.variable.parameter
  settings:
    fontStyle: italic
- name: Keyword new
  scope:
  - keyword.control.new
  - keyword.operator.new
  settings:
    fontStyle: bold italic
- name: Markup italic
  scope:
  - markup.italic
  settings:
    fontStyle: italic
- name: Markup bold
  scope:
  - markup.bold
  settings:
    fontStyle: bold
- name: Markup heading
  scope:
  - markup.heading
  settings:
    foreground: '#607080'
    fontStyle: bold
