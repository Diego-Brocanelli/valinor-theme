name: Create and Deploy Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão do package.json ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci

      # vscode:prepublish roda o build (que valida os temas) antes de empacotar.
      - run: mkdir -p ./bin && npm run package
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ./bin/valinor-theme.vsix

      - name: Create GitHub Release and upload .vsix
        uses: softprops/action-gh-release@v2
        with:
          files: ./bin/valinor-theme.vsix
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: ./bin

      # Publica exatamente o .vsix anexado à release, sem rebuild.
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath ./bin/valinor-theme.vsix -p ${{ secrets.VSCE_PUBLISHER_TOKEN }}
