name: Gallery (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/previews/**'
      - 'assets/icon.png'
      - 'icons/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Submódulos: ícones Symbols e Fluent usados na prévia ao vivo.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gera as versões WebP dos prints (sem ImageMagick a galeria usa só PNG).
      - name: ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick)

      # Gera os ícones por tema e Logos usados na prévia ao vivo.
      - run: npm run build

      - name: Gerar a galeria
        run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
