name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Validate themes (contraste, chaves e cores)
        run: npm run validate -- --quiet

      - name: Build and package
        run: mkdir -p ./bin && npm run package
        env:
          CI: true
